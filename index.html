<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BMI Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>BMI Calculator</h1>
    <p class="myname">(By Ashfaq Ali)</p>
    <p class="subtitle">Enter your weight and height to check your Body Mass Index.</p>


    <form id="bmi-form" novalidate>
      <label for="weight">Weight (kg)</label>
      <input type="number" id="weight" placeholder="e.g. 70" step="any">

      <label for="height">Height (cm)</label>
      <input type="number" id="height" placeholder="e.g. 175" step="any">

      <p id="error" class="error" role="alert"></p>

      <div class="buttons">
        <button type="submit" class="btn-primary">Calculate BMI</button>
        <button type="button" id="reset" class="btn-secondary">Reset</button>
      </div>
    </form>

    
    <section id="result" class="result" hidden aria-live="polite">
      <p class="result-label">Your BMI</p>
      <p id="bmi-value" class="bmi-value"></p>
      <p id="bmi-category" class="bmi-category"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
